<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14110f">
<title>pianolog · Wi-Fi</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14110f;--panel:#1d1916;--line:#2e2823;--ink:#efe8df;--dim:#9a8f83;--accent:#e8a33d;--bad:#e5533d;--ok:#7fb069}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:0 0 4px;font-weight:650}
h1 span{color:var(--accent)}
p{color:var(--dim);margin:0 0 16px}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.nets{display:flex;flex-direction:column;gap:6px}
.net{all:unset;display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.net:focus-visible,.net.sel{border-color:var(--accent)}
.net small{color:var(--dim)}
.btn{all:unset;cursor:pointer;display:inline-block;margin-top:18px;background:var(--accent);color:#1a1206;font-weight:650;border-radius:10px;padding:11px 18px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);margin-top:0;padding:6px 10px;font-size:13px;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
#msg{margin-top:16px;min-height:1.4em}
#msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>piano<span>log</span> · Wi-Fi</h1>
  <p>Choose the home network the recorder should join. This only works while your phone is connected to the recorder's own network.</p>

  <div class="row"><b>Networks nearby</b><button class="btn ghost" id="rescan" type="button">Scan again</button></div>
  <div class="nets" id="nets" style="margin-top:8px"><p>Scanning…</p></div>

  <form id="f">
    <label for="ssid">Network name</label>
    <input id="ssid" name="ssid" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <label for="pass">Password</label>
    <input id="pass" name="pass" type="password" maxlength="64" autocomplete="off">
    <button class="btn" type="submit">Save and connect</button>
  </form>
  <div id="msg" role="status"></div>
  <p style="margin-top:28px"><a href="/">Back to recordings</a></p>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bars = r => r > -55 ? "strong" : r > -70 ? "good" : "weak";
function msg(t, cls) { $("#msg").textContent = t; $("#msg").className = cls || ""; }

async function scan() {
  $("#nets").innerHTML = "<p>Scanning…</p>";
  try {
    const r = await fetch("/api/scan");
    if (r.status === 403) { $("#nets").innerHTML = "<p>Connect your phone to the recorder's own network to see nearby networks.</p>"; return; }
    const list = (await r.json()).sort((a, b) => b.rssi - a.rssi);
    $("#nets").innerHTML = list.length ? list.map(n =>
      `<button type="button" class="net" data-ssid="${esc(n.ssid)}"><span>${esc(n.ssid)}</span><small>${bars(n.rssi)}${n.open ? " · open" : ""}</small></button>`
    ).join("") : "<p>No networks found. Type the name below.</p>";
  } catch (e) { $("#nets").innerHTML = "<p>Scan failed. Type the name below.</p>"; }
}
$("#nets").addEventListener("click", e => {
  const b = e.target.closest(".net"); if (!b) return;
  document.querySelectorAll(".net").forEach(x => x.classList.toggle("sel", x === b));
  $("#ssid").value = b.dataset.ssid; $("#pass").focus();
});
$("#rescan").onclick = scan;
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  msg("Saving…");
  try {
    const r = await fetch("/api/wifi", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ ssid: $("#ssid").value, pass: $("#pass").value }) });
    if (!r.ok) { msg(await r.text(), "bad"); return; }
    msg(`Saved. The recorder is joining "${$("#ssid").value}". If it succeeds, its own network closes in about 15 seconds: reconnect your phone to your home Wi-Fi and open http://pianolog.local. If the password was wrong, this network stays and you can try again.`, "ok");
  } catch (e) { msg("Could not reach the recorder.", "bad"); }
});
scan();
</script>
</body>
</html>
