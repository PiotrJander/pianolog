<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fcfaf5">
<title>pianolog · Wi-Fi</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Cormorant Garamond";src:url(fonts/cormorant.woff2) format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/garamond.woff2) format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:"EB Garamond";src:url(fonts/garamond-italic.woff2) format("woff2");font-weight:400 600;font-style:italic;font-display:swap}
:root{--ground:#fcfaf5;--paper:#f6f1e6;--ivory:#fffdf8;--ink:#1d1b18;--body:#2a2722;--quiet:#6f675a;--hair:#d3cab8;--faint:#e8e1d2;
  --red:#b3381e;--green:#3f6b4f;--edge:rgba(60,50,30,.12);--shade:rgba(120,100,60,.07);
  --display:"Cormorant Garamond","Iowan Old Style",Palatino,Georgia,serif;--text:"EB Garamond","Iowan Old Style",Palatino,Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--body);font:18px/1.5 var(--text);font-variant-numeric:oldstyle-nums}
main{max-width:520px;margin:0 auto;padding:22px 20px 48px}
.sc{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:560;color:var(--ink)}
h1{font:400 clamp(42px,11vw,60px)/1.05 var(--display);color:var(--ink);margin:28px 0 8px}
p{font-style:italic;color:var(--quiet);margin:0 0 18px;font-size:16px}
.card{background:var(--paper);border:1px solid var(--edge);border-radius:4px;box-shadow:inset 0 0 60px var(--shade);padding:16px 20px 20px;margin-top:22px}
label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:560;color:var(--quiet);margin:18px 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--ivory);border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:8px 2px;font-variant-numeric:lining-nums}
input:focus{outline:none;border-bottom:2px solid var(--red);padding-bottom:7px}
.nets{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.nets p{margin:12px 0}
.net{all:unset;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 2px;border-bottom:1px solid var(--faint);cursor:pointer}
.net:hover span,.net.sel span{color:var(--red)}
.net:focus-visible{outline:1px solid var(--ink)}
.net span{font:400 22px/1.2 var(--display);color:var(--ink)}
.net small{font-style:italic;color:var(--quiet);font-size:15px}
.btn{all:unset;cursor:pointer;display:inline-block;margin-top:24px;background:var(--ink);color:var(--ground);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:560;border-radius:99px;padding:13px 22px}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn.ghost{background:none;color:var(--quiet);margin-top:0;padding:4px 0;border-radius:0;border-bottom:1px solid transparent}
.btn.ghost:hover{color:var(--ink);border-bottom-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
#msg{margin-top:18px;min-height:1.4em;font-style:italic}
#msg.bad{color:var(--red)} #msg.ok{color:var(--green)}
a{color:var(--ink)}
</style>
</head>
<body>
<main>
  <span class="sc">Pianolog</span>
  <h1>Joining your Wi-Fi</h1>
  <p>Choose the home network the recorder should join. This works while your phone is connected to the recorder's own network.</p>

  <div class="card">
  <div class="row"><span class="sc">Networks nearby</span><button class="btn ghost" id="rescan" type="button">Scan again</button></div>
  <div class="nets" id="nets"><p>Scanning…</p></div>

  <form id="f">
    <label for="ssid">Network name</label>
    <input id="ssid" name="ssid" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <label for="pass">Password</label>
    <input id="pass" name="pass" type="password" maxlength="64" autocomplete="off">
    <button class="btn" type="submit">Save and connect</button>
  </form>
  </div>
  <div id="msg" role="status"></div>
  <p style="margin-top:28px"><a href="/">Back to the recordings</a></p>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bars = r => r > -55 ? "strong" : r > -70 ? "good" : "weak";
function msg(t, cls) { $("#msg").textContent = t; $("#msg").className = cls || ""; }

async function scan() {
  $("#nets").innerHTML = "<p>Scanning…</p>";
  try {
    const r = await fetch("/api/scan");
    if (r.status === 403) { $("#nets").innerHTML = "<p>Connect your phone to the recorder's own network to see nearby networks.</p>"; return; }
    const list = (await r.json()).sort((a, b) => b.rssi - a.rssi);
    $("#nets").innerHTML = list.length ? list.map(n =>
      `<button type="button" class="net" data-ssid="${esc(n.ssid)}"><span>${esc(n.ssid)}</span><small>${bars(n.rssi)}${n.open ? " · open" : ""}</small></button>`
    ).join("") : "<p>No networks found. Type the name below.</p>";
  } catch (e) { $("#nets").innerHTML = "<p>Scan failed. Type the name below.</p>"; }
}
$("#nets").addEventListener("click", e => {
  const b = e.target.closest(".net"); if (!b) return;
  document.querySelectorAll(".net").forEach(x => x.classList.toggle("sel", x === b));
  $("#ssid").value = b.dataset.ssid; $("#pass").focus();
});
$("#rescan").onclick = scan;
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  msg("Saving…");
  try {
    const r = await fetch("/api/wifi", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ ssid: $("#ssid").value, pass: $("#pass").value }) });
    if (!r.ok) { msg(await r.text(), "bad"); return; }
    msg(`Saved. The recorder is joining "${$("#ssid").value}". If it succeeds, its own network closes in about 15 seconds: reconnect your phone to your home Wi-Fi and open http://pianolog.local. If the password was wrong, this network stays and you can try again.`, "ok");
  } catch (e) { msg("Could not reach the recorder.", "bad"); }
});
scan();
</script>
</body>
</html>
